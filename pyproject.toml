[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surpRISe"
version = "0.1.0"
description = "surpRISe: Simulator Under Reconfigurable Propagation in RIS Environments"
readme = "README.md"
authors = [
    { name = "Sergio Mico-Rosa", email = "sermiro@iteam.upv.es" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "plotly>=6.5.0",
    "scienceplots>=2.2.0",
    "scipy>=1.10.1",
]

[project.urls]
Homepage = "https://github.com/sergiomico/surpRISe"
Repository = "https://github.com/sergiomico/surpRISe"
Issues = "https://github.com/sergiomico/surpRISe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/surpRISe"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.14.9",
]

[tool.ruff]
# Match the minimum supported Python version.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Activate error rules (E), warnings (W), 
# import rules (I) and other useful ones.
select = ["E", "F", "I", "W", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
