name: Tests and package builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Regression tests
        run: uv run --locked python -m unittest discover -s tests
      - name: Single-user example
        run: uv run --locked python examples/single_user.py
      - name: Multiuser example
        run: uv run --locked python examples/multiuser_superposition.py
      - name: Style checks for maintained paths
        run: |
          uv run --locked ruff check examples tests src/surpRISe/optimizers/tx_ris_rx_multiuser_opt.py
          uv run --locked ruff format --check examples tests src/surpRISe/optimizers/tx_ris_rx_multiuser_opt.py
      - name: Report existing full-source lint debt
        continue-on-error: true
        run: uv run --locked ruff check src --statistics
      - name: Build source distribution and wheel
        run: uv build
